name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".config/dotnet-tools.json"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/backend-ci.yml"
      - "global.json"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".config/dotnet-tools.json"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/backend-ci.yml"
      - "global.json"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BUILD_CONFIGURATION: Release
  SOLUTION_PATH: backend/Spendly.sln
  UNIT_TESTS_PROJECT: backend/tests/Spendly.UnitTests/Spendly.UnitTests.csproj
  INTEGRATION_TESTS_PROJECT: backend/tests/Spendly.IntegrationTests/Spendly.IntegrationTests.csproj
  DOCKER_TEST_SETTINGS: backend/tests/docker.runsettings
  TEST_RESULTS_DIRECTORY: backend/TestResults

jobs:
  backend-ci:
    name: Restore, verify, build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local .NET tools
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json

      - name: Verify local EF Core CLI
        run: dotnet ef --version

      - name: Restore NuGet dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: >-
          dotnet build ${{ env.SOLUTION_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Verify EF Core migration model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project backend/src/Spendly.Infrastructure/Spendly.Infrastructure.csproj
          --startup-project backend/src/Spendly.Api/Spendly.Api.csproj
          --context SpendlyDbContext
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build

      - name: Audit vulnerable dependencies
        run: >-
          dotnet package list
          --project ${{ env.SOLUTION_PATH }}
          --include-transitive
          --vulnerable
          --no-restore

      - name: Report outdated dependencies
        run: >-
          dotnet package list
          --project ${{ env.SOLUTION_PATH }}
          --outdated
          --no-restore

      - name: Unit tests
        run: >-
          dotnet test ${{ env.UNIT_TESTS_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=unit-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ env.TEST_RESULTS_DIRECTORY }}/unit

      - name: API and metadata integration tests
        run: >-
          dotnet test ${{ env.INTEGRATION_TESTS_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=integration-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ env.TEST_RESULTS_DIRECTORY }}/integration

      - name: Verify Docker availability
        run: |
          docker version
          docker info

      - name: PostgreSQL Testcontainers tests
        run: >-
          dotnet test ${{ env.INTEGRATION_TESTS_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --verbosity normal
          --settings ${{ env.DOCKER_TEST_SETTINGS }}
          --filter "Dependency=Docker&FullyQualifiedName!~MigrationSmokeTests"
          --logger "trx;LogFileName=postgresql-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ env.TEST_RESULTS_DIRECTORY }}/postgresql

      - name: Migration smoke test
        run: >-
          dotnet test ${{ env.INTEGRATION_TESTS_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --verbosity normal
          --settings ${{ env.DOCKER_TEST_SETTINGS }}
          --filter "FullyQualifiedName~MigrationSmokeTests"
          --logger "trx;LogFileName=migration-smoke-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ env.TEST_RESULTS_DIRECTORY }}/migrations

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: ${{ env.TEST_RESULTS_DIRECTORY }}
          if-no-files-found: warn
          retention-days: 14
